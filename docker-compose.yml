name: sound

x-app: &app
  build: .
  restart: unless-stopped
  environment:
    FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:?requis}
    ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:?requis}
    ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:?ENTRA_CLIENT_SECRET requis}
    PUBLIC_BASE_URL: https://${DOMAIN}
    JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis}
    BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
    HA_URL: ${HA_URL:-}
    HA_TOKEN: ${HA_TOKEN:-}
    HA_TTS_SERVICE: ${HA_TTS_SERVICE:-notify.alexa_media}
    ALERT_FORCE_VOLUME: ${ALERT_FORCE_VOLUME:-true}
    ALERT_VOLUME: ${ALERT_VOLUME:-100}
    ANNOUNCE_FORCE_VOLUME: ${ANNOUNCE_FORCE_VOLUME:-true}
    ANNOUNCE_VOLUME: ${ANNOUNCE_VOLUME:-100}
    VOLUME_RESTORE_MARGIN: ${VOLUME_RESTORE_MARGIN:-3}
    VOLUME_RESTORE_MAX_WAIT: ${VOLUME_RESTORE_MAX_WAIT:-120}
    MA_URL: ${MA_URL:-}
    MA_TOKEN: ${MA_TOKEN:-}
    TEST_PREFIX: ${TEST_PREFIX:-Ceci est un test.}
    TEAMS_APP_ID: ${TEAMS_APP_ID:-}
    TEAMS_APP_SECRET: ${TEAMS_APP_SECRET:-}
    TEAMS_TENANT_ID: ${TEAMS_TENANT_ID:-}
    TEAMS_SERVICE_URL: ${TEAMS_SERVICE_URL:-}
    TEAMS_CONVERSATION_ID: ${TEAMS_CONVERSATION_ID:-}
    ROSTER_GROUP_ID: ${ROSTER_GROUP_ID:-}
    ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    ALERT_WEBHOOK_ENABLED: ${ALERT_WEBHOOK_ENABLED:-true}
    ALERT_WEBHOOK_BATCH: ${ALERT_WEBHOOK_BATCH:-50}
    RESPONSE_LINKS: ${RESPONSE_LINKS:-false}
    RESPONSE_LINK_TTL_HOURS: ${RESPONSE_LINK_TTL_HOURS:-48}
    RL_RESPONSE_LINK_LIMIT: ${RL_RESPONSE_LINK_LIMIT:-600}
    REMIND_COOLDOWN: ${REMIND_COOLDOWN:-300}
    AUTO_REMIND_INTERVAL: ${AUTO_REMIND_INTERVAL:-600}
    AUTO_REMIND_MAX: ${AUTO_REMIND_MAX:-3}
    VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    PUSH_ALLOWED_HOSTS: ${PUSH_ALLOWED_HOSTS:-}
    NOTIFY_NO_RESPONSE_MIN: ${NOTIFY_NO_RESPONSE_MIN:-5}
    NOTIFY_RATE_THRESHOLD: ${NOTIFY_RATE_THRESHOLD:-50}
    NOTIFY_RATE_AFTER_MIN: ${NOTIFY_RATE_AFTER_MIN:-15}
    NOTIFY_TEAMS_USER_IDS: ${NOTIFY_TEAMS_USER_IDS:-}
    RESPONSE_RETENTION_DAYS: ${RESPONSE_RETENTION_DAYS:-90}
    RL_WINDOW: ${RL_WINDOW:-60}
    RL_AUTH_LIMIT: ${RL_AUTH_LIMIT:-30}
    RL_REFRESH_LIMIT: ${RL_REFRESH_LIMIT:-30}
    RL_ANNOUNCE_LIMIT: ${RL_ANNOUNCE_LIMIT:-20}
    RL_MUSIC_LIMIT: ${RL_MUSIC_LIMIT:-120}
    RL_WEBHOOK_LIMIT: ${RL_WEBHOOK_LIMIT:-3000}

services:
  api:
    <<: *app
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    networks: [internal, edge]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *app
    command: ["arq", "app.worker.WorkerSettings"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HA_URL: ${HA_URL:-}
      HA_TOKEN: ${HA_TOKEN:-}
      RESPONSE_RETENTION_DAYS: ${RESPONSE_RETENTION_DAYS:-90}
      HA_TTS_SERVICE: ${HA_TTS_SERVICE:-notify.alexa_media}
      ALERT_FORCE_VOLUME: ${ALERT_FORCE_VOLUME:-true}
      ALERT_VOLUME: ${ALERT_VOLUME:-100}
      ANNOUNCE_FORCE_VOLUME: ${ANNOUNCE_FORCE_VOLUME:-true}
      ANNOUNCE_VOLUME: ${ANNOUNCE_VOLUME:-100}
      VOLUME_RESTORE_MARGIN: ${VOLUME_RESTORE_MARGIN:-3}
      VOLUME_RESTORE_MAX_WAIT: ${VOLUME_RESTORE_MAX_WAIT:-120}
      MA_URL: ${MA_URL:-}
      MA_TOKEN: ${MA_TOKEN:-}
      TEST_PREFIX: ${TEST_PREFIX:-Ceci est un test.}
      PUBLIC_BASE_URL: https://${DOMAIN}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:?requis}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:?requis}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:?ENTRA_CLIENT_SECRET requis}
      TEAMS_APP_ID: ${TEAMS_APP_ID:-}
      TEAMS_APP_SECRET: ${TEAMS_APP_SECRET:-}
      TEAMS_TENANT_ID: ${TEAMS_TENANT_ID:-}
      TEAMS_SERVICE_URL: ${TEAMS_SERVICE_URL:-}
      TEAMS_CONVERSATION_ID: ${TEAMS_CONVERSATION_ID:-}
      ROSTER_GROUP_ID: ${ROSTER_GROUP_ID:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_ENABLED: ${ALERT_WEBHOOK_ENABLED:-true}
      ALERT_WEBHOOK_BATCH: ${ALERT_WEBHOOK_BATCH:-50}
      RESPONSE_LINKS: ${RESPONSE_LINKS:-false}
      RESPONSE_LINK_TTL_HOURS: ${RESPONSE_LINK_TTL_HOURS:-48}
      RL_RESPONSE_LINK_LIMIT: ${RL_RESPONSE_LINK_LIMIT:-600}
    ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    ALERT_WEBHOOK_ENABLED: ${ALERT_WEBHOOK_ENABLED:-true}
    ALERT_WEBHOOK_BATCH: ${ALERT_WEBHOOK_BATCH:-50}
    RESPONSE_LINKS: ${RESPONSE_LINKS:-false}
    RESPONSE_LINK_TTL_HOURS: ${RESPONSE_LINK_TTL_HOURS:-48}
    RL_RESPONSE_LINK_LIMIT: ${RL_RESPONSE_LINK_LIMIT:-600}
      REMIND_COOLDOWN: ${REMIND_COOLDOWN:-300}
      AUTO_REMIND_INTERVAL: ${AUTO_REMIND_INTERVAL:-600}
      AUTO_REMIND_MAX: ${AUTO_REMIND_MAX:-3}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      PUSH_ALLOWED_HOSTS: ${PUSH_ALLOWED_HOSTS:-}
      NOTIFY_NO_RESPONSE_MIN: ${NOTIFY_NO_RESPONSE_MIN:-5}
      NOTIFY_RATE_THRESHOLD: ${NOTIFY_RATE_THRESHOLD:-50}
      NOTIFY_RATE_AFTER_MIN: ${NOTIFY_RATE_AFTER_MIN:-15}
      NOTIFY_TEAMS_USER_IDS: ${NOTIFY_TEAMS_USER_IDS:-}
      RUN_MIGRATIONS: "0"
    networks: [internal, edge]
    depends_on:
      redis: {condition: service_healthy}
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "arq", "--check", "app.worker.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    command:
      - sh
      - -c
      - 'while true; do /scripts/backup.sh || echo "backup en echec" >&2; sleep "$${BACKUP_INTERVAL_SECONDS}"; done'
    volumes:
      - backups:/backups
    networks: [internal]
    depends_on:
      db: {condition: service_healthy}

  caddy:
    profiles: [caddy]
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-${DOMAIN}}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-private_ranges}
      HTTP_PORT: ${HTTP_PORT:-80}
      HTTPS_PORT: ${HTTPS_PORT:-443}
    ports:
      - "${HTTP_PORT:-80}:${HTTP_PORT:-80}"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  internal:
    internal: true
  edge:

volumes:
  db_data:
  redis_data:
  caddy_data:
  caddy_config:
  backups:
