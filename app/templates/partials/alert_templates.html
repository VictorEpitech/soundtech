<ul class="list">
  {% for t in rows %}
  <li>
    <form class="stack" hx-patch="/alert-templates/{{ t.id }}" hx-ext="json-typed" data-json data-bools="is_active" hx-swap="none" data-refresh="#alert-templates" data-toast="Modèle enregistré">
      <div class="row between"><strong>{{ t.type }}</strong>
        <label class="field"><span>État</span><select name="is_active"><option value="true" {% if t.is_active %}selected{% endif %}>Actif</option><option value="false" {% if not t.is_active %}selected{% endif %}>Inactif</option></select></label></div>
      <label class="field"><span>Libellé du bouton</span><input type="text" name="label" value="{{ t.label }}" required maxlength="60"></label>
      <label class="field"><span>Titre</span><input type="text" name="title" value="{{ t.title }}" required maxlength="255"></label>
      <label class="field"><span>Message (lu sur les enceintes et envoyé sur Teams)</span><textarea name="message" rows="3" required maxlength="500">{{ t.message }}</textarea></label>
      <div class="row">
        <label class="field"><span>Icône (Material Symbols)</span><input class="mono" type="text" name="icon" value="{{ t.icon or '' }}" maxlength="64" pattern="[a-z0-9_]+"></label>
        <label class="field"><span>Couleur (#rrggbb)</span><input class="mono" type="text" name="color" value="{{ t.color or '' }}" maxlength="7" pattern="#[0-9a-fA-F]{6}"></label>
      </div>
      <button class="btn btn-tonal" type="submit"><span class="icon" aria-hidden="true">save</span>Enregistrer</button>
    </form>
  </li>
  {% else %}
  <li class="muted">Aucun modèle.</li>
  {% endfor %}
</ul>
