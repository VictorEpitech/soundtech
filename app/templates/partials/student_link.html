<div class="row">
  <label class="field grow"><span>Lien (valable {{ ttl }} h, affiché une seule fois)</span><input type="text" readonly value="{{ url }}" onfocus="this.select()"></label>
  <button class="btn btn-filled" type="button" data-copy="{{ url }}" data-copy-toast="Lien copié"><span class="icon" aria-hidden="true">content_copy</span>Copier</button>
</div>
