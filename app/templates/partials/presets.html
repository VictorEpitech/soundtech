{% from "_macros.html" import active_toggle %}
<ul class="list">
  {% for p in rows %}
  <li>
    <form class="stack" hx-patch="/presets/{{ p.id }}" hx-swap="none" data-json data-refresh="#presets" data-toast="Message mis à jour">
      <label class="field"><span>Titre</span><input type="text" name="title" value="{{ p.title }}" required maxlength="255"></label>
      <label class="field"><span>Texte</span><textarea name="text" rows="2" required maxlength="1000">{{ p.text }}</textarea></label>
      <button class="btn btn-tonal" type="submit"><span class="icon" aria-hidden="true">save</span>Enregistrer</button>
    </form>
    <div class="row">
        {{ active_toggle("/presets/" ~ p.id, p.is_active, 'Actif', 'Inactif', '#presets') }}
        <button class="btn btn-icon btn-danger" type="button" hx-delete="/presets/{{ p.id }}" hx-confirm="Supprimer ce message ?" hx-swap="none" data-refresh="#presets" title="Supprimer" aria-label="Supprimer"><span class="icon" aria-hidden="true">delete</span></button>
    </div>
  </li>
  {% else %}
  <li class="muted">Aucun message.</li>
  {% endfor %}
</ul>
