{% if groups is not defined %}
{% elif not groups %}
<p class="muted">Aucun résultat pour « {{ q }} ».</p>
{% else %}
{% for label, items in groups %}
<h3 class="results-title">{{ label }}</h3>
<ul class="list media-list">
  {% for i in items %}
  <li>
    <button class="media" type="button" data-uri="{{ i.uri }}" data-name="{{ i.name }}" data-type="{{ i.media_type }}">
      <img class="cover" src="{{ i.image or '/static/cover.svg' }}" alt="" loading="lazy" width="48" height="48">
      <span class="media-text">
        <strong>{{ i.name }}</strong>
        {% set sub = (i.artists or []) | select | join(', ') %}{% set alb = i.album if i.album is string else (i.album.name if i.album and i.album.name else '') %}
        {% if sub or alb %}<span class="muted small media-sub">{{ sub }}{% if sub and alb %} · {% endif %}{{ alb }}</span>{% endif %}
      </span>
      <span class="icon media-more" aria-hidden="true">more_vert</span>
    </button>
  </li>
  {% endfor %}
</ul>
{% endfor %}
{% endif %}
