{% from "_macros.html" import active_toggle %}
<ul class="list">
  {% for s in rows %}
  <li>
    <form class="grid-form" hx-patch="/speakers/{{ s.id }}" hx-swap="none" data-json data-refresh="#speakers" data-toast="Enceinte mise à jour">
      <p class="mono muted small span-all">{{ s.entity_id }}</p>
      <label class="field"><span>Nom</span><input type="text" name="name" value="{{ s.name }}" required maxlength="255"></label>
      <label class="field"><span>Groupe</span><input type="text" name="group" value="{{ s.group or '' }}" maxlength="100"></label>
      <label class="field"><span>notify_service</span><input class="mono" type="text" name="notify_service" value="{{ s.notify_service or '' }}" pattern="[a-z0-9_]+\.[a-z0-9_]+"></label>
      <label class="field"><span>ma_player_id</span><input class="mono" type="text" name="ma_player_id" value="{{ s.ma_player_id or '' }}" pattern="\S(.*\S)?"></label>
      <button class="btn btn-tonal" type="submit"><span class="icon" aria-hidden="true">save</span>Enregistrer</button>
    </form>
    <div class="row">
        {{ active_toggle("/speakers/" ~ s.id, s.is_active, 'Active', 'Inactive', '#speakers') }}
        <button class="btn btn-icon btn-danger" type="button" hx-delete="/speakers/{{ s.id }}" hx-confirm="Supprimer {{ s.name }} ?" hx-swap="none" data-refresh="#speakers" title="Supprimer" aria-label="Supprimer"><span class="icon" aria-hidden="true">delete</span></button>
    </div>
  </li>
  {% else %}
  <li class="muted">Aucune enceinte.</li>
  {% endfor %}
</ul>
