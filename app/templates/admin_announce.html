{% extends "admin_base.html" %}
{% block title %}Annonces{% endblock %}
{% block admin_content %}
<section class="card">
  <h2>Voix des annonces</h2>
  <p class="muted small">Préréglage appliqué quand l'auteur ne choisit rien. Les alertes de sécurité gardent toujours la voix par défaut de l'enceinte.</p>
  <form class="row" hx-put="/announcements/defaults" hx-ext="json-typed" data-json data-toast="Préréglage enregistré" hx-swap="none">
    <label class="field grow"><span>Voix par défaut</span>
      <select name="voice"><option value="">Voix de l'enceinte</option>{% for v in voices %}<option value="{{ v }}" {% if v == defaults.voice %}selected{% endif %}>{{ v }}</option>{% endfor %}</select>
    </label>
    <label class="field grow"><span>Langue par défaut</span>
      <select name="lang"><option value="">Langue de l'enceinte</option>{% for l in langs %}<option value="{{ l }}" {% if l == defaults.lang %}selected{% endif %}>{{ l }}</option>{% endfor %}</select>
    </label>
    <button class="btn btn-filled" type="submit"><span class="icon" aria-hidden="true">save</span>Enregistrer</button>
  </form>
</section>

<section class="card">
  <h2>Messages pré-enregistrés</h2>
  <form class="stack" hx-post="/presets" hx-ext="json-typed" data-json data-toast="Message créé" data-reset data-refresh="#presets" hx-swap="none">
    <label class="field"><span>Titre</span><input type="text" name="title" required maxlength="255"></label>
    <label class="field"><span>Texte</span><textarea name="text" rows="2" required maxlength="1000"></textarea></label>
    <button class="btn btn-filled" type="submit"><span class="icon" aria-hidden="true">add</span>Ajouter</button>
  </form>
  <div id="presets" hx-get="/ui/admin/presets" hx-trigger="load, refresh"></div>
</section>
{% endblock %}
