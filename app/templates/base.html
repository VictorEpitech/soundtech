<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Sound{% endblock %} · Sound</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=JetBrains+Mono:wght@400;500&family=Roboto:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0&display=swap">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body hx-ext="json-typed">
{% if user %}
  <header class="appbar">
    <a class="brand" href="/"><span class="icon">graphic_eq</span>Sound</a>
    <nav class="nav" aria-label="Navigation principale">
      <a href="/" {% if active == 'home' %}aria-current="page"{% endif %}><span class="icon">home</span><span>Accueil</span></a>
      <a href="/music" {% if active == 'music' %}aria-current="page"{% endif %}><span class="icon">music_note</span><span>Musique</span></a>
      <a href="/announce" {% if active == 'announce' %}aria-current="page"{% endif %}><span class="icon">campaign</span><span>Annonces</span></a>
      <a href="/alerts" {% if active == 'alerts' %}aria-current="page"{% endif %}><span class="icon">emergency_home</span><span>Alertes</span></a>
      {% if user.role == 'admin' %}
      <a href="/admin" {% if active == 'admin' %}aria-current="page"{% endif %}><span class="icon">admin_panel_settings</span><span>Admin</span></a>
      {% endif %}
    </nav>
    <div class="who">
      <span class="mono">{{ role_labels.get(user.role, user.role) }}</span>
      <button class="btn btn-text" type="button" data-logout title="Se déconnecter"><span class="icon">logout</span></button>
    </div>
  </header>
{% endif %}
  <main class="page">{% block content %}{% endblock %}</main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  {% block scripts %}{% endblock %}
</body>
</html>
